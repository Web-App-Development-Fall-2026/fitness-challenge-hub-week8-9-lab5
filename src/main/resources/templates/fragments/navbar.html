
<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<body>

    <!-- Reusable Navbar Fragment -->
    <nav th:fragment="navbar"
         class="navbar navbar-expand-lg glass-nav sticky-top">

        <div class="container py-1">

            <!-- Brand Logo -->
            <a class="navbar-brand d-flex align-items-center gap-2 text-white fw-bold"
               th:href="@{/challenges}">

                <span class="brand-logo-icon text-white">
                    <i class="bi bi-lightning-charge-fill fs-5"></i>
                </span>

                <span class="fs-4 tracking-tight">
                    FitSquad<span class="text-gradient">Hub</span>
                </span>
            </a>

            <!-- Mobile Toggler -->
            <button class="navbar-toggler border-secondary text-white"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navMenu"
                    aria-controls="navMenu"
                    aria-expanded="false"
                    aria-label="Toggle navigation">

                <i class="bi bi-list fs-3 text-white"></i>
            </button>

            <!-- Navigation Links -->
            <div class="collapse navbar-collapse" id="navMenu">

                <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-4 gap-lg-1">

                    <!-- All Authenticated Users -->
                    <li class="nav-item">
                        <a class="nav-link text-light px-3 rounded-pill"
                           th:href="@{/challenges}">
                            <i class="bi bi-grid-fill me-1 text-primary"></i>
                            Challenges
                        </a>
                    </li>

                    <!-- Coach and Admin Only -->
                    <li class="nav-item"
                        sec:authorize="hasAnyRole('COACH', 'ADMIN')">

                        <a class="nav-link text-light px-3 rounded-pill"
                           th:href="@{/create-challenge}">
                            <i class="bi bi-plus-circle-fill me-1 text-info"></i>
                            Create Challenge
                        </a>
                    </li>

                    <!-- Workout Logs -->
                    <li class="nav-item">
                        <a class="nav-link text-light px-3 rounded-pill"
                           th:href="@{/workout-logs}">
                            <i class="bi bi-journal-check me-1 text-success"></i>
                            Workout Logs
                        </a>
                    </li>

                    <!-- Log Workout -->
                    <li class="nav-item">
                        <a class="nav-link text-light px-3 rounded-pill"
                           th:href="@{/log-workout}">
                            <i class="bi bi-fire me-1 text-warning"></i>
                            Log Workout
                        </a>
                    </li>

                    <!-- Coaches -->
                    <li class="nav-item">
                        <a class="nav-link text-light px-3 rounded-pill"
                           th:href="@{/coaches}">
                            <i class="bi bi-person-badge-fill me-1 text-danger"></i>
                            Coaches
                        </a>
                    </li>

                    <!-- Admin Only: Register Coach -->
                    <li class="nav-item"
                        sec:authorize="hasRole('ADMIN')">

                        <a class="nav-link text-light px-3 rounded-pill"
                           th:href="@{/create-coach}">
                            <i class="bi bi-person-plus-fill me-1 text-warning"></i>
                            Register Coach
                        </a>
                    </li>

                    <!-- Admin Only: H2 Console -->
                    <li class="nav-item"
                        sec:authorize="hasRole('ADMIN')">

                        <a class="nav-link text-light px-3 rounded-pill"
                           th:href="@{/h2-console}">
                            <i class="bi bi-database-fill-gear me-1 text-info"></i>
                            H2 Console
                        </a>
                    </li>

                </ul>

                <!-- Right Side Navigation -->
                <div class="d-flex align-items-center gap-2 mt-2 mt-lg-0">

                    <!-- Course Badge -->
                    <span class="badge bg-dark-subtle border border-secondary-subtle px-3 py-2 rounded-pill text-light fw-normal">
                        <i class="bi bi-shield-lock-fill me-1 text-info"></i>
                        CPAN-228 &bull; Spring Security
                    </span>

                    <!-- Logged In Username -->
                    <span class="text-light small"
                          sec:authorize="isAuthenticated()">

                        <i class="bi bi-person-circle me-1 text-info"></i>

                        <span sec:authentication="name"></span>
                    </span>

                    <!-- Log Workout Button -->
                    <a th:href="@{/log-workout}"
                       class="btn btn-sm btn-join rounded-pill px-3">

                        <i class="bi bi-fire me-1"></i>
                        Log Workout
                    </a>

                    <!-- Logout Button -->
                    <form th:action="@{/logout}"
                          method="post"
                          class="d-inline"
                          sec:authorize="isAuthenticated()">

                        <button type="submit"
                                class="btn btn-sm btn-outline-light rounded-pill px-3">

                            <i class="bi bi-box-arrow-right me-1"></i>
                            Logout
                        </button>

                    </form>

                </div>

            </div>

        </div>

    </nav>

</body>
</html>
