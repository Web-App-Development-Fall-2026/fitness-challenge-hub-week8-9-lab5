<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - FitSquad Hub</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #101827, #1e293b);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
        }

        .register-card {
            background: #1e293b;
            padding: 40px;
            border-radius: 15px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .register-card h2 {
            color: #38bdf8;
            font-weight: bold;
        }

        .form-label {
            color: white;
        }

        .btn-register {
            background: #38bdf8;
            color: #0f172a;
            font-weight: bold;
            border: none;
        }

        .btn-register:hover {
            background: #0ea5e9;
        }

        .login-link {
            color: #38bdf8;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="register-card">

    <h2 class="text-center mb-3">Join FitSquad Hub</h2>

    <p class="text-center text-light mb-4">
        Create your account and start your fitness journey
    </p>

    <!-- Registration error message -->
    <div th:if="${error}" class="alert alert-danger"
         th:text="${error}">
    </div>

    <!-- Registration Form -->
    <form th:action="@{/register}" th:object="${user}" method="post">

        <!-- Username -->
        <div class="mb-3">

            <label for="username" class="form-label">
                Username
            </label>

            <input type="text"
                   class="form-control"
                   id="username"
                   th:field="*{username}"
                   placeholder="Choose a username"
                   minlength="3"
                   required>

        </div>

        <!-- Password -->
        <div class="mb-3">

            <label for="password" class="form-label">
                Password
            </label>

            <input type="password"
                   class="form-control"
                   id="password"
                   th:field="*{password}"
                   placeholder="Create a password"
                   minlength="6"
                   autocomplete="new-password"
                   required>

        </div>

        <!-- Register as Coach -->
        <div class="form-check form-switch mb-4">

            <input class="form-check-input"
                   type="checkbox"
                   id="registerAsCoach"
                   name="registerAsCoach"
                   value="true">

            <label class="form-check-label text-light"
                   for="registerAsCoach">

                Register as a Certified <strong>Coach</strong>
                (allows creating fitness challenges)

            </label>

        </div>

        <!-- Register Button -->
        <button type="submit"
                class="btn btn-register w-100 py-2">

            Create Account

        </button>

    </form>

    <p class="text-center text-light mt-4">

        Already have an account?

        <a th:href="@{/login}" class="login-link">
            Login here
        </a>

    </p>

</div>

</body>
</html>
