
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Register | FitSquad Hub</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-dark text-light">

    <main class="container min-vh-100 d-flex
                 justify-content-center align-items-center">

        <div class="card bg-secondary text-light shadow-lg border-0"
             style="max-width: 450px; width: 100%;">

            <div class="card-body p-4">

                <h1 class="text-center fw-bold mb-2">
                    Join FitSquad Hub
                </h1>

                <p class="text-center mb-4">
                    Create your account
                </p>

                <div class="alert alert-danger"
                     th:if="${error}"
                     th:text="${error}">
                </div>

                <form th:action="@{/register}"
                      th:object="${user}"
                      method="post">

                    <div class="mb-3">
                        <label for="username" class="form-label">
                            Username
                        </label>

                        <input type="text"
                               class="form-control"
                               th:field="*{username}"
                               required>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label">
                            Password
                        </label>

                        <input type="password"
                               class="form-control"
                               th:field="*{password}"
                               required>
                    </div>

                    <!-- Register as Coach -->
                    <div class="form-check form-switch mb-4">

                        <input class="form-check-input"
                               type="checkbox"
                               id="registerAsCoach"
                               name="registerAsCoach"
                               value="true">

                        <label class="form-check-label"
                               for="registerAsCoach">
                            Register as a Certified
                            <strong>Coach</strong>
                        </label>

                    </div>

                    <button type="submit"
                            class="btn btn-info w-100 fw-bold">
                        Create Account
                    </button>

                </form>

                <hr class="my-4">

                <p class="text-center mb-0">
                    Already have an account?
                    <a th:href="@{/login}"
                       class="text-info fw-bold">
                        Sign in here
                    </a>
                </p>

            </div>
        </div>

    </main>

</body>
</html>
