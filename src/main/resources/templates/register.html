<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitSquad Hub - Create Account</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css">
</head>
<body>
<main class="container min-vh-100 d-flex align-items-center justify-content-center py-5">
    <div class="col-12 col-md-8 col-lg-5">
        <div class="text-center mb-4">
            <a class="text-decoration-none text-white fw-bold fs-3" th:href="@{/challenges}">
                <i class="bi bi-lightning-charge-fill text-info"></i> FitSquad<span class="text-gradient">Hub</span>
            </a>
            <h1 class="h3 text-white mt-3 mb-1">Join FitSquad Hub</h1>
            <p class="text-secondary">Create an account and start building your fitness journey.</p>
        </div>
        <section class="form-card p-4 p-md-5">
            <form th:action="@{/register}" th:object="${user}" method="post">
                <div class="mb-3">
                    <label class="form-label text-light" for="username">Username</label>
                    <input class="form-control" type="text" id="username" th:field="*{username}" autocomplete="username" required>
                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
                </div>
                <div class="mb-4">
                    <label class="form-label text-light" for="password">Password</label>
                    <input class="form-control" type="password" id="password" th:field="*{password}" autocomplete="new-password" required>
                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                </div>
                <div class="form-check form-switch mb-4">
                    <input class="form-check-input" type="checkbox" id="registerAsCoach" name="registerAsCoach" value="true">
                    <label class="form-check-label text-light" for="registerAsCoach">
                        Register as a Certified <strong>Coach</strong> (allows creating fitness challenges)
                    </label>
                </div>
                <button class="btn btn-join w-100 rounded-pill py-2" type="submit">Create Account</button>
            </form>
            <p class="text-center text-secondary mt-4 mb-0">
                Already registered? <a class="link-info" th:href="@{/login}">Sign in</a>
            </p>
        </section>
    </div>
</main>
</body>
</html>
