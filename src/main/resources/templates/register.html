<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitSquad Hub - Register</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="container min-vh-100 d-flex align-items-center justify-content-center py-5">
    <div class="col-12 col-md-7 col-lg-5">

        <div class="text-center mb-4">
            <h1 class="display-6 fw-bold text-white">
                Join FitSquad<span class="text-gradient">Hub</span>
            </h1>
            <p class="text-secondary">Create your account</p>
        </div>

        <div class="form-card p-4">

            <form th:action="@{/register}"
                  th:object="${user}"
                  method="post">

                <div class="mb-3">
                    <label for="username" class="form-label text-white">
                        Username
                    </label>
                    <input type="text"
                           id="username"
                           th:field="*{username}"
                           class="form-control form-control-dark"
                           th:classappend="${#fields.hasErrors('username')} ? 'is-invalid' : ''"
                           placeholder="Choose a username"
                           required>

                    <div class="invalid-feedback"
                         th:if="${#fields.hasErrors('username')}"
                         th:errors="*{username}">
                        Username error
                    </div>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label text-white">
                        Password
                    </label>
                    <input type="password"
                           id="password"
                           th:field="*{password}"
                           class="form-control form-control-dark"
                           th:classappend="${#fields.hasErrors('password')} ? 'is-invalid' : ''"
                           placeholder="Choose a password"
                           required>

                    <div class="invalid-feedback"
                         th:if="${#fields.hasErrors('password')}"
                         th:errors="*{password}">
                        Password error
                    </div>
                </div>

                <div class="form-check mb-4">
                    <input class="form-check-input"
                           type="checkbox"
                           id="registerAsCoach"
                           name="registerAsCoach"
                           value="true">

                    <label class="form-check-label text-light"
                           for="registerAsCoach">
                        Register as a Coach
                    </label>
                </div>

                <button type="submit"
                        class="btn btn-join w-100 rounded-pill py-2">
                    <i class="bi bi-person-plus-fill me-1"></i>
                    Create Account
                </button>

            </form>

            <p class="text-center text-secondary mt-4 mb-0">
                Already have an account?
                <a th:href="@{/login}" class="text-info text-decoration-none">
                    Login here
                </a>
            </p>

        </div>
    </div>
</div>

</body>
</html>
