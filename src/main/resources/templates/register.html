
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - FitSquad Hub</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-dark text-light">

<div class="container d-flex justify-content-center align-items-center"
     style="min-height: 100vh;">

    <div class="card bg-secondary text-light shadow p-4"
         style="width: 450px;">

        <h2 class="text-center mb-3">FitSquad Hub</h2>
        <h4 class="text-center mb-4">Create Account</h4>

        <div th:if="${error}" class="alert alert-danger"
             th:text="${error}">
        </div>

        <form th:action="@{/register}" method="post"
              th:object="${user}">

            <div class="mb-3">
                <label for="username" class="form-label">
                    Username
                </label>

                <input type="text"
                       class="form-control"
                       id="username"
                       th:field="*{username}"
                       placeholder="Enter username"
                       required>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">
                    Password
                </label>

                <input type="password"
                       class="form-control"
                       id="password"
                       th:field="*{password}"
                       placeholder="Enter password"
                       required>
            </div>

            <div class="form-check form-switch mb-4">
                <input class="form-check-input"
                       type="checkbox"
                       id="registerAsCoach"
                       name="registerAsCoach"
                       value="true">

                <label class="form-check-label text-light"
                       for="registerAsCoach">
                    Register as a Certified
                    <strong>Coach</strong>
                    (allows creating fitness challenges)
                </label>
            </div>

            <button type="submit"
                    class="btn btn-success w-100">
                Register
            </button>

        </form>

        <p class="text-center mt-4">
            Already have an account?
            <a th:href="@{/login}" class="text-info">
                Login here
            </a>
        </p>

    </div>
</div>

</body>
</html>
