<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitSquad Hub - Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="container min-vh-100 d-flex align-items-center justify-content-center py-5">
    <div class="col-12 col-md-7 col-lg-5">

        <div class="text-center mb-4">
            <h1 class="display-6 fw-bold text-white">
                FitSquad<span class="text-gradient">Hub</span>
            </h1>
            <p class="text-secondary">Sign in to your account</p>
        </div>

        <div class="form-card p-4">

            <div th:if="${param.error}"
                 class="alert alert-danger">
                Invalid username or password.
            </div>

            <div th:if="${param.logout}"
                 class="alert alert-success">
                You have been logged out successfully.
            </div>

            <div th:if="${param.registered}"
                 class="alert alert-success">
                Registration completed! You can now sign in.
            </div>

            <form th:action="@{/login}" method="post">

                <div class="mb-3">
                    <label for="username" class="form-label text-white">
                        Username
                    </label>
                    <input type="text"
                           id="username"
                           name="username"
                           class="form-control form-control-dark"
                           placeholder="Enter your username"
                           required>
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label text-white">
                        Password
                    </label>
                    <input type="password"
                           id="password"
                           name="password"
                           class="form-control form-control-dark"
                           placeholder="Enter your password"
                           required>
                </div>

                <button type="submit"
                        class="btn btn-join w-100 rounded-pill py-2">
                    <i class="bi bi-box-arrow-in-right me-1"></i>
                    Login
                </button>
            </form>

            <p class="text-center text-secondary mt-4 mb-0">
                Don't have an account?
                <a th:href="@{/register}" class="text-info text-decoration-none">
                    Register here
                </a>
            </p>
        </div>

    </div>
</div>

</body>
</html>
