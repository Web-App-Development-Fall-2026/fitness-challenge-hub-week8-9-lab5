<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitSquad Hub - Sign In</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css">
</head>
<body>
<main class="container min-vh-100 d-flex align-items-center justify-content-center py-5">
    <div class="col-12 col-md-8 col-lg-5">
        <div class="text-center mb-4">
            <a class="text-decoration-none text-white fw-bold fs-3" th:href="@{/challenges}">
                <i class="bi bi-lightning-charge-fill text-info"></i> FitSquad<span class="text-gradient">Hub</span>
            </a>
            <h1 class="h3 text-white mt-3 mb-1">Welcome back</h1>
            <p class="text-secondary">Sign in to continue your fitness journey.</p>
        </div>
        <section class="form-card p-4 p-md-5">
            <div class="alert alert-danger" role="alert" th:if="${param.error}">
                Invalid username or password.
            </div>
            <div class="alert alert-success" role="alert" th:if="${param.logout}">
                You have been signed out safely.
            </div>
            <div class="alert alert-success" role="alert" th:if="${param.registered}">
                Your account is ready. Please sign in.
            </div>
            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label class="form-label text-light" for="username">Username</label>
                    <input class="form-control" type="text" id="username" name="username" autocomplete="username" required autofocus>
                </div>
                <div class="mb-4">
                    <label class="form-label text-light" for="password">Password</label>
                    <input class="form-control" type="password" id="password" name="password" autocomplete="current-password" required>
                </div>
                <button class="btn btn-join w-100 rounded-pill py-2" type="submit">Sign In</button>
            </form>
            <p class="text-center text-secondary mt-4 mb-0">
                New to FitSquad? <a class="link-info" th:href="@{/register}">Create an athlete or coach account</a>
            </p>
        </section>
    </div>
</main>
</body>
</html>
